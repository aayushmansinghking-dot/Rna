<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ANSH | Secure Vault</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family: 'Segoe UI', sans-serif;
}

body{
    background: radial-gradient(circle at top, #0a0f2c, #000);
    color:white;
    overflow:hidden;
}

/* ---------- PAGE SETUP ---------- */
.page{
    display:none;
    width:100vw;
    height:100vh;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

.page.active{
    display:flex;
}

/* ---------- FUTURISTIC BUTTON ---------- */
.start-btn{
    width:320px;
    height:180px;
    border-radius:20px;
    border:2px solid cyan;
    box-shadow:0 0 30px cyan;
    cursor:pointer;
    overflow:hidden;
    position:relative;
    transition:0.3s;
}

.start-btn:hover{
    transform:scale(1.05);
    box-shadow:0 0 60px cyan;
}

.start-btn video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* ---------- VIDEO GRID ---------- */
.video-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(260px,1fr));
    gap:30px;
    width:90%;
}

.video-card{
    background:#050b2a;
    border:2px solid #00f7ff;
    border-radius:15px;
    box-shadow:0 0 20px #00f7ff;
    cursor:pointer;
    transition:0.3s;
}

.video-card:hover{
    transform:translateY(-8px);
    box-shadow:0 0 40px #00f7ff;
}

.video-card video{
    width:100%;
    border-radius:15px 15px 0 0;
}

.video-title{
    padding:12px;
    text-align:center;
    font-weight:bold;
    letter-spacing:1px;
}

/* ---------- WARNING SCREEN ---------- */
#warning{
    position:fixed;
    inset:0;
    background:#ff0000;
    display:none;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    z-index:100;
    animation:flash 0.2s infinite;
}

@keyframes flash{
    0%{opacity:1;}
    50%{opacity:0.85;}
    100%{opacity:1;}
}

#warning h1{
    font-size:3rem;
    margin-bottom:20px;
    text-shadow:0 0 20px black;
}

/* ---------- PASSWORD BOX ---------- */
.password-box{
    margin-top:20px;
    background:#000;
    padding:20px;
    border-radius:12px;
    border:2px solid red;
    box-shadow:0 0 30px red;
}

.password-box input{
    padding:10px;
    width:250px;
    background:black;
    color:red;
    border:1px solid red;
    outline:none;
}

.password-box button{
    margin-left:10px;
    padding:10px 20px;
    background:red;
    color:white;
    border:none;
    cursor:pointer;
}

#error{
    margin-top:15px;
    color:white;
    font-weight:bold;
}
</style>
</head>

<body>

<!-- ---------- PAGE 1 ---------- -->
<div class="page active" id="page1">
    <h1 style="margin-bottom:30px; letter-spacing:3px;">ANSH ACCESS</h1>
    <div class="start-btn" onclick="goToVideos()">
        <video autoplay muted loop>
            <source src="video.mp4" type="video/mp4">
        </video>
    </div>
    <p style="margin-top:15px; opacity:0.7;">Click to continue</p>
</div>

<!-- ---------- PAGE 2 ---------- -->
<div class="page" id="page2">
    <h1 style="margin-bottom:40px;">VIDEO ARCHIVE</h1>

    <div class="video-grid">

        <div class="video-card" onclick="showWarning()">
            <video muted loop autoplay>
                <source src="fake1.mp4" type="video/mp4">
            </video>
            <div class="video-title">ANSH WITH AYUSHMAN</div>
        </div>

        <div class="video-card" onclick="showWarning()">
            <video muted loop autoplay>
                <source src="fake2.mp4" type="video/mp4">
            </video>
            <div class="video-title">ANSH WITH PIYUSH ON ROAD</div>
        </div>

        <div class="video-card" onclick="showWarning()">
            <video muted loop autoplay>
                <source src="fake3.mp4" type="video/mp4">
            </video>
            <div class="video-title">ANSH WITH PIYUSH AT HOUSE</div>
        </div>

    </div>
</div>

<!-- ---------- WARNING ---------- -->
<div id="warning">
    <h1>PERMISSION NEEDED BY AAYUSHMAN</h1>

    <div class="password-box">
        <input type="password" id="pass" placeholder="Enter Password">
        <button onclick="checkPass()">ENTER</button>
        <div id="error"></div>
    </div>

    <audio id="beep">
        <source src="beep.mp3" type="audio/mpeg">
    </audio>
</div>

<script>
function goToVideos(){
    document.getElementById("page1").classList.remove("active");
    document.getElementById("page2").classList.add("active");
}

function showWarning(){
    const warning = document.getElementById("warning");
    const beep = document.getElementById("beep");
    warning.style.display="flex";
    beep.play();

    setTimeout(()=>{
        beep.pause();
        beep.currentTime=0;
    },2000);
}

function checkPass(){
    document.getElementById("error").innerText="INCORRECT PASSWORD";
}
</script>

</body>
</html>
